name: Package Log Doctor

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Create offline app archive and checksum
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          zip -r "dist/clausewitz-log-doctor-${version}.zip" index.html app.js core.mjs styles.css README.md LICENSE CHANGELOG.md VERSION
          cd dist
          sha256sum "clausewitz-log-doctor-${version}.zip" > "clausewitz-log-doctor-${version}.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
